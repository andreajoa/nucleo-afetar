name: Verificar website
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar TypeScript
        run: npm run check
      - name: Gerar aplicação Next.js
        run: npm run build
      - name: Conferir páginas essenciais
        shell: bash
        run: |
          test -f .next/BUILD_ID
          test -f public/icon.svg || test -f app/icon.svg
          node - <<'NODE'
          const routes = require('./.next/server/app-paths-manifest.json');
          for (const route of ['/page', '/sobre/page', '/servicos/page', '/equipe/page', '/contato/page', '/privacidade/page']) {
            if (!routes[route]) throw new Error(`Página ausente no build: ${route}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-afetar-next-build
          path: .next/server/
          retention-days: 7
